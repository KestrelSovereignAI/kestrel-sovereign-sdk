name: SDK CI

on:
  push:
    branches:
      - 'main'
      - 'sdk-*'
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: 'Immutable source commit SHA to check out for every CI job'
        required: false
        type: string

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install package with crypto extra
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-lint
          . .venv-lint/bin/activate
          uv pip install -e '.[crypto]'

      - name: Validate package imports
        run: |
          . .venv-lint/bin/activate
          python -c "
          import importlib, pkgutil, sys
          import kestrel_sdk
          failed = []
          for m in pkgutil.walk_packages(kestrel_sdk.__path__, prefix='kestrel_sdk.'):
              try:
                  importlib.import_module(m.name)
              except Exception as e:
                  failed.append((m.name, repr(e)))
          if failed:
              for name, err in failed:
                  print(f'{name}: {err}', file=sys.stderr)
              sys.exit(1)
          print('All kestrel_sdk submodules import cleanly.')
          "
        timeout-minutes: 3

  test:
    runs-on: ${{ matrix.os }}
    needs: lint-and-imports
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$MATRIX_PYTHON_VERSION"

      - name: Run SDK test suite
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$MATRIX_PYTHON_VERSION" --group test pytest

  build-check:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Build exact wheel + forced sdist
        run: |
          set -euo pipefail
          BUILD_CONSTRAINTS=$(mktemp)
          trap 'rm -f "$BUILD_CONSTRAINTS"' EXIT
          cat > "$BUILD_CONSTRAINTS" <<'EOF'
          hatchling==1.31.0 \
              --hash=sha256:6b48ad4068a482ed7239b3a8215bc55b47aad3345d58dfc94e553c5d2d46211b \
              --hash=sha256:aac80bec8b6fe35e8480f1c335be8910fa210a0e6f735a139be205dadcacb544
          packaging==26.2 \
              --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e \
              --hash=sha256:ff452ff5a3e828ce110190feff1178bb1f2ea2281fa2075aadb987c2fb221661
          pathspec==1.1.1 \
              --hash=sha256:17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a \
              --hash=sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          pluggy==1.6.0 \
              --hash=sha256:7dcc130b76258d33b90f61b658791dede3486c3e6bfb003ee5c9bfb396dd22f3 \
              --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          trove-classifiers==2026.6.1.19 \
              --hash=sha256:ab4c4ec93cc4a4e7815fa759906e05e6bb3f2fbd92ea0f897288c6a43efd15b3 \
              --hash=sha256:c5132b4b61a829d11cfbd2d72e97f20a45ed6edb95e45c5efdeb5e00836b2745
          EOF
          uv build --wheel --sdist --clear --force-pep517 \
            --build-constraints "$BUILD_CONSTRAINTS" --require-hashes

      - name: Inspect wheel contents
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Inspecting $WHEEL"
          uv run --no-project python -c "
          import zipfile, sys
          z = zipfile.ZipFile('$WHEEL')
          names = z.namelist()
          # Forbid framework content: kestrel_sovereign/ as a path component
          # (NOT kestrel_sovereign_sdk-... which is the SDK's own dist-info).
          forbidden = [n for n in names if n.startswith('kestrel_sovereign/')]
          if forbidden:
              print('ERROR: wheel contains kestrel_sovereign framework content:', forbidden, file=sys.stderr)
              sys.exit(1)
          missing = [m for m in ['kestrel_sdk/__init__.py', 'kestrel_sdk/features/base.py'] if m not in names]
          if missing:
              print('ERROR: wheel missing expected files:', missing, file=sys.stderr)
              sys.exit(1)
          print(f'Wheel OK ({len(names)} entries)')
          "

      - name: Ensure exactly one wheel and one sdist were built
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 1

      - name: Upload exact build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-dist
          path: dist/
          if-no-files-found: error

  artifact-test:
    runs-on: ubuntu-latest
    needs: build-check
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$MATRIX_PYTHON_VERSION"

      - name: Download exact build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-dist
          path: dist/

      - name: Clean install + import exact wheel and sdist
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -e
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          SDIST=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$WHEEL"
          test -n "$SDIST"
          uv venv --python "$MATRIX_PYTHON_VERSION" .venv-test
          uv pip install --python .venv-test/bin/python "$WHEEL"
          SMOKE_DIR=$(mktemp -d)
          (
          cd "$SMOKE_DIR"
          "$GITHUB_WORKSPACE/.venv-test/bin/python" -c "
          import kestrel_sdk
          from kestrel_sdk.features.base import Feature
          from kestrel_sdk.signals.models import Signal
          from kestrel_sdk.security import SecurityError
          import os
          print('wheel core imports OK on Python ' + os.environ['MATRIX_PYTHON_VERSION'])
          "
          )
          uv pip install --python .venv-test/bin/python "${WHEEL}[crypto]"
          (
          cd "$SMOKE_DIR"
          "$GITHUB_WORKSPACE/.venv-test/bin/python" -c "
          from kestrel_sdk.security.aead import AEADCipher
          from kestrel_sdk.security import encryption
          import os
          print('wheel crypto imports OK on Python ' + os.environ['MATRIX_PYTHON_VERSION'])
          "
          )
          uv venv --python "$MATRIX_PYTHON_VERSION" .venv-sdist
          uv pip install --python .venv-sdist/bin/python "$SDIST"
          (
          cd "$SMOKE_DIR"
          "$GITHUB_WORKSPACE/.venv-sdist/bin/python" -c "
          import kestrel_sdk
          from kestrel_sdk.features.base import Feature
          from kestrel_sdk.signals.models import Signal
          from kestrel_sdk.security import SecurityError
          import os
          print('sdist core imports OK on Python ' + os.environ['MATRIX_PYTHON_VERSION'])
          "
          )
          uv pip install --python .venv-sdist/bin/python "${SDIST}[crypto]"
          (
          cd "$SMOKE_DIR"
          "$GITHUB_WORKSPACE/.venv-sdist/bin/python" -c "
          from kestrel_sdk.security.aead import AEADCipher
          from kestrel_sdk.security import encryption
          import os
          print('sdist crypto imports OK on Python ' + os.environ['MATRIX_PYTHON_VERSION'])
          "
          )

name: SDK CI

on:
  push:
    branches:
      - 'main'
      - 'sdk-*'
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install package with crypto extra
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv-lint
          . .venv-lint/bin/activate
          uv pip install -e '.[crypto]'

      - name: Validate package imports
        run: |
          . .venv-lint/bin/activate
          python -c "
          import importlib, pkgutil, sys
          import kestrel_sdk
          failed = []
          for m in pkgutil.walk_packages(kestrel_sdk.__path__, prefix='kestrel_sdk.'):
              try:
                  importlib.import_module(m.name)
              except Exception as e:
                  failed.append((m.name, repr(e)))
          if failed:
              for name, err in failed:
                  print(f'{name}: {err}', file=sys.stderr)
              sys.exit(1)
          print('All kestrel_sdk submodules import cleanly.')
          "
        timeout-minutes: 3

  build-check:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build sdist + wheel
        run: uv build

      - name: Inspect wheel contents
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Inspecting $WHEEL"
          uv run --with check-wheel-contents --no-project check-wheel-contents "$WHEEL" || true
          uv run --no-project python -c "
          import zipfile, sys
          z = zipfile.ZipFile('$WHEEL')
          names = z.namelist()
          # Forbid framework content: kestrel_sovereign/ as a path component
          # (NOT kestrel_sovereign_sdk-... which is the SDK's own dist-info).
          forbidden = [n for n in names if n.startswith('kestrel_sovereign/')]
          if forbidden:
              print('ERROR: wheel contains kestrel_sovereign framework content:', forbidden, file=sys.stderr)
              sys.exit(1)
          missing = [m for m in ['kestrel_sdk/__init__.py', 'kestrel_sdk/features/base.py'] if m not in names]
          if missing:
              print('ERROR: wheel missing expected files:', missing, file=sys.stderr)
              sys.exit(1)
          print(f'Wheel OK ({len(names)} entries)')
          "

  install-check:
    runs-on: ubuntu-latest
    needs: build-check
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Clean install + import smoke test (no crypto extra)
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-test
          . .venv-test/bin/activate
          uv pip install .
          python -c "
          import kestrel_sdk
          from kestrel_sdk.features.base import Feature
          from kestrel_sdk.signals.models import Signal
          from kestrel_sdk.security import SecurityError
          print(f'kestrel_sdk core imports OK on Python ${{ matrix.python-version }}')
          "

      - name: Clean install with crypto extra + crypto-path smoke test
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-crypto
          . .venv-crypto/bin/activate
          uv pip install '.[crypto]'
          python -c "
          from kestrel_sdk.security.aead import AEADCipher
          from kestrel_sdk.security import encryption
          print(f'kestrel_sdk[crypto] imports OK on Python ${{ matrix.python-version }}')
          "

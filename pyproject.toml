[project]
name = "kestrel-sovereign-sdk"
version = "0.23.0"
description = "Kestrel Sovereign SDK — lightweight interfaces and protocols for feature packages"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UncleSaurus" }]
maintainers = [{ name = "UncleSaurus" }]
keywords = [
    "ai",
    "agents",
    "sovereign",
    "constitutional-ai",
    "did",
    "sdk",
    "lightweight",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# For feature packages that need encryption helpers
crypto = [
    "cryptography>=42.0",
]
# Enables real Prometheus metrics (kestrel_sdk.metrics). Without this
# extra installed, all metric handles are no-op None values and the
# /metrics endpoint serves an empty body — callers do not need to
# guard their imports.
metrics = [
    "prometheus-client>=0.21.0",
]
# Test dependencies
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "cryptography>=42.0",
    "prometheus-client>=0.21.0",
]

[project.urls]
Homepage = "https://kestrelsovereign.com"
Source = "https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk"
Issues = "https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk/issues"
Documentation = "https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_sdk"]

[tool.hatch.build.targets.sdist]
include = ["kestrel_sdk/**/*", "README.md", "LICENSE", "pyproject.toml"]

[project]
name = "kestrel-sovereign-sdk"
version = "0.42.0"
description = "Kestrel Sovereign SDK — lightweight interfaces and protocols for feature packages"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "kestrel_sdk/native_a2a/LICENSE"]
authors = [{ name = "UncleSaurus" }]
maintainers = [{ name = "UncleSaurus" }]
keywords = [
    "ai",
    "agents",
    "sovereign",
    "constitutional-ai",
    "did",
    "sdk",
    "lightweight",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "idna>=3.20,<4",
]

[project.optional-dependencies]
# One modified official A2A implementation shared by hosts and skill producers.
# Base SDK consumers still install only pydantic/idna; this extra supplies
# the native wire types, HTTP bindings and signing dependencies.
a2a = [
    "httpx>=0.28.1",
    "pydantic>=2.11.3",
    "protobuf>=5.29.5",
    "google-api-core>=1.26.0",
    "json-rpc>=1.15.0",
    "googleapis-common-protos>=1.70.0",
    "culsans>=0.11.0 ; python_full_version < '3.13'",
    "packaging>=24.0",
    "sse-starlette",
    "starlette",
    "PyJWT[crypto]>=2.13.0",
    "cryptography>=48.0.1",
]
# Optional native clients; outbound URL policy itself has no HTTP dependency.
httpx = ["httpx>=0.28.1,<1", "httpcore[asyncio]>=1.0.9,<2"]
httpx2 = ["httpx2>=2.13.1,<3", "httpcore2[asyncio]>=2.13.1,<3"]
# For feature packages that need encryption helpers
crypto = [
    "cryptography>=42.0",
]
# Enables real Prometheus metrics (kestrel_sdk.metrics). Without this
# extra installed, all metric handles are no-op None values and the
# /metrics endpoint serves an empty body — callers do not need to
# guard their imports.
metrics = [
    "prometheus-client>=0.21.0",
]
# OTel-native tracing helper (kestrel_sdk.tracing) — OpenInference span
# builders + Kestrel attribute conventions + OTLP/HTTP export. The one
# implementation of the span conventions, shared by Sovereign core, talon,
# and feature packages. Kept optional so the base SDK stays lightweight:
# `import kestrel_sdk.tracing` succeeds without this extra, and `configure()`
# then returns the no-op tracer (guarded imports) — callers never guard.
tracing = [
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2",
    "openinference-semantic-conventions>=0.1.9",
]
# Test dependencies
test = [
    "kestrel-sovereign-sdk[a2a,httpx,httpx2]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.1",
    "pytest-mock>=3.14.0",
    "respx>=0.20.2",
    "rfc8785>=0.1.4",
    "grpcio>=1.60",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.21.0",
    "cryptography>=42.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2",
    "openinference-semantic-conventions>=0.1.9",
]

[project.urls]
Homepage = "https://kestrelsovereign.com"
Source = "https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk"
Issues = "https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk/issues"
Documentation = "https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk/blob/main/README.md"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = ["kestrel-sovereign-sdk[test]"]

[tool.hatch.build.targets.wheel]
packages = ["kestrel_sdk"]

[tool.hatch.build.targets.sdist]
include = ["kestrel_sdk/**/*", "CHANGELOG.md", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-p no:kestrel"
